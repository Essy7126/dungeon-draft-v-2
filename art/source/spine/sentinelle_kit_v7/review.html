<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentinelle d’airain · Kit d’animations</title>
<link rel="stylesheet" href="/player/spine-player.css"><script src="/player/iife/spine-player.js"></script>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",sans-serif;background:#12191c;color:#e9e5db}*{box-sizing:border-box}body{margin:0;padding:28px 36px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:30px;font-weight:550;letter-spacing:-.7px;margin:8px 0}.eyebrow{color:#c4a46b;font-size:11px;letter-spacing:2px;text-transform:uppercase}.muted{color:#98a6a9;font-size:13px}.badge{border:1px solid #4d4838;border-radius:20px;padding:8px 13px;color:#d6b980;font-size:12px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 18px}button,select{font:inherit;font-size:13px;border:1px solid #38464a;border-radius:7px;padding:9px 15px;background:#202b30;color:inherit;cursor:pointer}button:hover,select:hover{border-color:#b79b63}button[aria-pressed=true]{background:#c5a46c;color:#171c1d;border-color:#c5a46c}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #edc77b;outline-offset:3px}.spacer{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{position:relative;border:1px solid #334045;border-radius:11px;overflow:hidden;background:#1b252a}.card h2{position:absolute;z-index:3;top:15px;left:20px;font-size:13px;font-weight:500;margin:0;pointer-events:none;color:#b2bec0}.viewer{height:350px}.card.single .viewer{height:540px}.grid.focus{grid-template-columns:1fr}.card[hidden]{display:none}.spine-player{border:0!important}.transport{display:flex;align-items:center;gap:12px;margin:18px 0 10px}input[type=range]{flex:1;accent-color:#c5a46c;min-width:80px}#clock{font:12px ui-monospace,monospace;width:106px}#notes{line-height:1.7;font-size:13px;color:#b3bdbb}footer{margin-top:18px;padding-top:15px;border-top:1px solid #2e3b3f;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:#91a0a3}#error{color:#ff9e8b;white-space:pre-wrap}@media(max-width:750px){body{padding:18px}.grid{grid-template-columns:1fr}header{display:block}.badge{display:inline-block;margin-top:10px}.viewer{height:360px}.transport{flex-wrap:wrap}.spacer{display:none}}
</style></head><body>
<header><div><div class="eyebrow">Dungeon Draft / Atelier de mouvement</div><h1>Sentinelle d’airain</h1><div class="muted">24 animations · 4 directions · Révision des mouvements</div></div><div class="badge">Spine · Essai local</div></header>
<nav class="toolbar" aria-label="Animation" id="actions"></nav>
<div class="toolbar" style="margin-top:0"><div id="directions"></div><span class="spacer"></span><label class="muted" for="speed">Vitesse&nbsp;</label><select id="speed"><option value="0.25">× 0,25</option><option value="0.5">× 0,5</option><option value="1" selected>× 1</option></select><button id="repeat" aria-pressed="false">Répéter les actions</button></div>
<main class="grid" id="grid"></main>
<div class="transport"><button id="play">Pause</button><button id="restart">Rejouer</button><input id="seek" aria-label="Position dans l’animation" type="range" min="0" max="1" step="0.001" value="0"><output id="clock">0,00 / 2,40 s</output></div>
<div id="notes"></div><div id="error" role="alert"></div>
<footer><span>Les quatre vues conservent leurs dessins d’origine.</span><span id="status">Chargement des squelettes…</span></footer>
<script>
const clips={idle:['Repos',2.4,'Respiration contenue, garde maintenue. Boucle continue.'],walk:['Marche',.72,'Deux genoux fléchissent vers l’avant. Pas parallèles, appui prolongé et pieds à plat.'],attack:['Estoc',.8,'Mise en garde, appui du pied avant, puis poussée coordonnée du bassin, du buste et du bras. Impact à 0,40 s.'],cast:['Sort',.88,'Charge plus marquée, bouclier armé puis projeté en avant avec le buste. Émission à 0,44 s.'],hit:['Impact reçu',.2,'Recul du buste, réaction de la tête et reprise des appuis.'],death:['Disparition',.8,'Petite explosion noire : la Sentinelle disparaît à 0,16 s, puis la fumée se dissipe entièrement.']};
const players={};const faults=[];let action='idle',t=0,playing=true,repeat=false,speed=1,last=performance.now();
const $=id=>document.getElementById(id);window.__kit={players,faults,get action(){return action},get time(){return t}};
for(const [key,[label]]of Object.entries(clips)){const b=document.createElement('button');b.textContent=label;b.dataset.action=key;b.onclick=()=>selectAction(key);$('actions').append(b)}
for(const key of ['Toutes','E','S','W','N']){const b=document.createElement('button');b.textContent=key==='Toutes'?'4 vues':key;b.dataset.direction=key;b.style.marginRight='6px';b.onclick=()=>{document.querySelectorAll('[data-direction]').forEach(el=>el.setAttribute('aria-pressed',el===b));$('grid').classList.toggle('focus',key!=='Toutes');for(const d of ['E','S','W','N']){$('card-'+d).hidden=key!=='Toutes'&&key!==d;$('card-'+d).classList.toggle('single',key!=='Toutes')}};b.setAttribute('aria-pressed',key==='Toutes');$('directions').append(b)}
for(const d of ['E','S','W','N']){const card=document.createElement('section');card.className='card';card.id='card-'+d;card.innerHTML=`<h2>VUE ${d}</h2><div class="viewer" id="player-${d}"></div>`;$('grid').append(card);new spine.SpinePlayer('player-'+d,{skeleton:`./${d}/sentinelle.json`,atlas:`./${d}/sentinelle.atlas`,animation:'idle',showControls:false,premultipliedAlpha:false,backgroundColor:'#1b252aff',alpha:false,viewport:{x:-330,y:-135,width:740,height:510,padLeft:0,padRight:0,padTop:0,padBottom:0},success:p=>{players[d]=p;p.animationState.timeScale=0;p.animationState.setAnimation(0,action,false);$('status').textContent=`${Object.keys(players).length} / 4 squelettes chargés`;if(Object.keys(players).length===4)window.__kitReady=true},error:(_p,msg)=>{faults.push(d+': '+msg);$('error').textContent=faults.join('\n')}})}
function selectAction(name){action=name;t=0;playing=true;for(const p of Object.values(players)){p.skeleton.setToSetupPose();p.animationState.clearTracks();p.animationState.setAnimation(0,name,false)}document.querySelectorAll('[data-action]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.action===action));$('notes').textContent=clips[action][2];$('play').textContent='Pause';$('seek').max=clips[action][1]}
function seek(value){t=Math.max(0,Math.min(clips[action][1],value));for(const p of Object.values(players)){const track=p.animationState.getCurrent(0);if(track)track.trackTime=t}}
window.__kit.seek=value=>{playing=false;seek(value);document.getElementById('play').textContent='Lire'};window.__kit.select=selectAction;
$('play').onclick=()=>{if(t>=clips[action][1])seek(0);playing=!playing;$('play').textContent=playing?'Pause':'Lire'};
$('restart').onclick=()=>{seek(0);playing=true;$('play').textContent='Pause'};
$('repeat').onclick=()=>{repeat=!repeat;$('repeat').setAttribute('aria-pressed',repeat)};
$('speed').onchange=e=>speed=Number(e.target.value);
$('seek').oninput=e=>{playing=false;seek(Number(e.target.value));$('play').textContent='Lire'};
selectAction('idle');
function frame(now){const dt=Math.min((now-last)/1000,.1);last=now;if(playing&&window.__kitReady){let next=t+dt*speed;if(next>clips[action][1]){if(repeat||action==='idle'||action==='walk')next%=clips[action][1];else{next=clips[action][1];playing=false;$('play').textContent='Lire'}}seek(next)}$('seek').value=t;$('clock').textContent=`${t.toFixed(2)} / ${clips[action][1].toFixed(2)} s`;$('clock').textContent=$('clock').textContent.replaceAll('.',',');requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
