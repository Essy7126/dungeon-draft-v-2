name: Observatory CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatory-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Snapshot, Godot and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: observatory/package-lock.json

      - name: Resolve pinned toolchain
        shell: bash
        run: |
          node -e "const t=require('./tools/observatory/toolchain.json'); for (const [k,v] of Object.entries({GODOT_URL:t.godot_official_download_url,GODOT_SHA256:t.godot_sha256,GODOT_BINARY:t.godot_binary_name})) console.log(k+'='+v)" >> "$GITHUB_ENV"

      - name: Download and verify official Godot
        shell: bash
        run: |
          curl --fail --silent --show-error --location "$GODOT_URL" --output "$RUNNER_TEMP/godot.zip"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/$GODOT_BINARY"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/$GODOT_BINARY" >> "$GITHUB_ENV"

      - name: Import Godot project
        run: |
          "$GODOT_BIN" --headless --path . --import --quit

      - name: Generate current snapshot
        run: |
          "$GODOT_BIN" --headless --path . -s res://tools/observatory/export_snapshot.gd

      - name: Verify snapshot provenance
        shell: bash
        run: |
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('observatory/public/data/latest.json'));if(s.meta.source_game_commit!==process.env.GITHUB_SHA||s.meta.source_worktree_dirty_before_export!==false||s.meta.source_generated_from_clean_checkout!==true)throw new Error('Invalid snapshot provenance')"

      - name: Run Observatory GUT suite
        run: >-
          "$GODOT_BIN" --headless --path . -s res://addons/gut/gut_cmdln.gd
          -gdir=res://test/unit/observatory -ginclude_subdirs -gprefix=test_
          -gexit -gdisable_colors

      - name: Enforce full GUT baseline
        shell: pwsh
        run: |
          ./tools/observatory/ci/Verify-GutBaseline.ps1 -GodotPath "$env:GODOT_BIN" -ProjectRoot "$env:GITHUB_WORKSPACE"

      - name: Install frontend dependencies
        working-directory: observatory
        run: npm ci

      - name: Install pinned Playwright browser
        working-directory: observatory
        run: npx playwright install --with-deps chromium

      - name: Validate and build frontend
        working-directory: observatory
        run: npm run check

      - name: Generate validation manifests
        run: node tools/observatory/ci/create-validation-manifests.mjs .

      - name: Upload Observatory validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observatory-validation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            observatory/public/data/latest.json
            observatory/dist/
            observatory/playwright-report/
            observatory/test-results/
            artifacts/observatory-ci/
