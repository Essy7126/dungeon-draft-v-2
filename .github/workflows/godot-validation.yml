name: Godot validation

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7"
  GODOT: "/home/runner/godot-bin/godot"

defaults:
  run:
    shell: bash

jobs:
  studio-contracts:
    name: STUDIO-CONTRACTS
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.3
        with:
          path: ~/godot-bin
          key: godot-4.7-stable-linux-x86_64
      - name: Installer Godot 4.7 stable
        run: |
          set -euo pipefail
          if [ ! -x "$GODOT" ]; then
            file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
            archive="$RUNNER_TEMP/godot-${GODOT_VERSION}.zip"
            extract_dir="$RUNNER_TEMP/godot-${GODOT_VERSION}-extract"
            mkdir -p "$extract_dir"
            curl -fsSL -o "$archive" "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${file}.zip"
            unzip -q "$archive" -d "$extract_dir"
            mkdir -p "$HOME/godot-bin"
            mv "$extract_dir/$file" "$GODOT"
            chmod +x "$GODOT"
            rm -f "$archive"
            rmdir "$extract_dir"
          fi
          "$GODOT" --version | grep '^4.7.stable'
      - name: Scan Godot
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --import >/dev/null 2>&1 || true
          "$GODOT" --headless --path . --import 2>&1 | tee import.log
          python3 - <<'PY'
          import re
          from pathlib import Path

          lines = Path("import.log").read_text(encoding="utf-8", errors="replace").splitlines()
          bad = re.compile(r"SCRIPT ERROR|Parse Error|Failed to load script")
          known = "res://output/validation-feedback-candidate/data/items/item_definition.gd"
          unexpected = []
          for index, line in enumerate(lines):
              if not bad.search(line):
                  continue
              context = "\n".join(lines[max(0, index - 2):min(len(lines), index + 4)])
              if known not in context:
                  unexpected.append(context)
          if unexpected:
              print("Unexpected Godot import errors:")
              print("\n---\n".join(unexpected))
              raise SystemExit(1)
          print("Godot import contains no unexpected script error.")
          PY
      - name: Contrats Studio ciblés
        run: |
          set -euo pipefail
          # Des chemins exacts évitent qu'un préfixe large (par exemple
          # test_skill_tree_studio) rejoue aussi ses suites de hardening.
          test_scripts=(
            res://test/unit/test_dungeon_draft_studio_2_0.gd
            res://test/unit/test_terrain_studio_refonte.gd
            res://test/unit/test_terrain_studio_novice_scenario.gd
            res://test/unit/test_terrain_test_integration_path.gd
            res://test/unit/test_validated_audit_corrections.gd
            res://test/unit/test_encounter_studio_v1.gd
            res://test/unit/test_encounter_document_safety.gd
            res://test/unit/test_room_draft_encounters.gd
            res://test/unit/test_item_studio_v1.gd
            res://test/unit/test_vfx_studio_slice.gd
            res://test/unit/test_vfx_flipbook_foundation.gd
            res://test/unit/test_meshy_bridge_security.gd
            res://test/unit/test_arena_production_hardening_phase1.gd
            res://test/unit/test_arena_art_pipeline_v3.gd
            res://test/unit/test_arena_atomic_production_v2.gd
            res://test/unit/test_room_integration_guided_pipeline.gd
            res://test/unit/test_arena_direct_test_runtime_parity.gd
            res://test/unit/test_arena_runtime_preview_and_direct_test_v2.gd
            res://test/unit/test_arena_stone_floor_visibility.gd
            res://test/unit/test_arena_studio_phase10_11_hardening.gd
            res://test/unit/test_run_content_isolation.gd
            res://test/unit/test_skill_tree_complete_contract.gd
            res://test/unit/test_skill_tree_generic_effects.gd
            res://test/unit/test_skill_tree_resolver.gd
            res://test/unit/test_skill_tree_screen_complete_ui.gd
            res://test/unit/test_skill_tree_studio.gd
            res://test/unit/test_skill_tree_studio_hardening.gd
            res://test/unit/test_fixed_trio_mage_lifecycle.gd
            res://test/unit/test_progression_lifecycle.gd
            res://test/unit/test_three_character_party_lifecycle.gd
          )
          gut_args=()
          for test_script in "${test_scripts[@]}"; do
            test -f "${test_script#res://}"
            gut_args+=("-gtest" "$test_script")
          done
          # Sans configuration vide, .gutconfig.json rajouterait tout test/unit.
          "$GODOT" --headless --path . -s res://addons/gut/gut_cmdln.gd \
            -gconfig= "${gut_args[@]}" -gexit

  baseline-guard:
    name: BASELINE-GUARD
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.3
        with:
          path: ~/godot-bin
          key: godot-4.7-stable-linux-x86_64
      - name: Installer Godot 4.7 stable
        run: |
          set -euo pipefail
          if [ ! -x "$GODOT" ]; then
            file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
            archive="$RUNNER_TEMP/godot-${GODOT_VERSION}.zip"
            extract_dir="$RUNNER_TEMP/godot-${GODOT_VERSION}-extract"
            mkdir -p "$extract_dir"
            curl -fsSL -o "$archive" "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${file}.zip"
            unzip -q "$archive" -d "$extract_dir"
            mkdir -p "$HOME/godot-bin"
            mv "$extract_dir/$file" "$GODOT"
            chmod +x "$GODOT"
            rm -f "$archive"
            rmdir "$extract_dir"
          fi
      - name: Suite globale avec allowlist exacte
        run: |
          set -uo pipefail
          gut_log="$RUNNER_TEMP/global-gut.log"
          "$GODOT" --headless --path . -s res://addons/gut/gut_cmdln.gd \
            -gdir=res://test/unit -ginclude_subdirs -gprefix=test_ -gexit 2>&1 \
            | tee "$gut_log"
          # Les échecs historiques donnent 1 ; un crash conserve son vrai statut.
          gut_status=${PIPESTATUS[0]}
          set -e
          python3 tools/verify_gut_historical_allowlist.py \
            "$gut_log" tools/gut_historical_allowlist.json "$gut_status"
          if [ -n "$(git status --short --untracked-files=all)" ]; then
            echo "::error::La suite GUT a modifié le worktree"
            git status --short --untracked-files=all
            exit 1
          fi
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: global-gut-log
          path: ${{ runner.temp }}/global-gut.log

  lint:
    name: LINT
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Diff, version et chemins portables
        env:
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$VALIDATION_BASE_SHA" ] \
              && git cat-file -e "${VALIDATION_BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$VALIDATION_BASE_SHA" HEAD
          else
            git show --check --format= HEAD
          fi
          grep -q 'version="2.0.0"' addons/dungeon_draft_arena_studio/plugin.cfg
          grep -q 'PRODUCT_VERSION := "2.0.0"' addons/dungeon_draft_arena_studio/studio_version.gd
          # Exige un vrai segment utilisateur : les tests peuvent mentionner
          # littéralement « C:\\Users\\ » sans contenir un chemin de machine.
          ! grep -RInE '[A-Za-z]:[\\/]+Users[\\/]+[^\\/[:space:]\"]+[\\/]|/home/[^/[:space:]]+/' \
            addons/dungeon_draft_arena_studio addons/meshy-godot-plugin \
            vfx items test/unit tools/achilles_theorycraft
          python3 -m json.tool tools/gut_historical_allowlist.json >/dev/null

  visual-smoke:
    name: VISUAL-SMOKE
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.3
        with:
          path: ~/godot-bin
          key: godot-4.7-stable-linux-x86_64
      - name: Installer Godot 4.7 stable
        run: |
          set -euo pipefail
          if [ ! -x "$GODOT" ]; then
            file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
            archive="$RUNNER_TEMP/godot-${GODOT_VERSION}.zip"
            extract_dir="$RUNNER_TEMP/godot-${GODOT_VERSION}-extract"
            mkdir -p "$extract_dir"
            curl -fsSL -o "$archive" "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${file}.zip"
            unzip -q "$archive" -d "$extract_dir"
            mkdir -p "$HOME/godot-bin"
            mv "$extract_dir/$file" "$GODOT"
            chmod +x "$GODOT"
            rm -f "$archive"
            rmdir "$extract_dir"
          fi
      - name: Capture du workspace Terrain actuel
        run: |
          "$GODOT" --headless --path . \
            res://addons/dungeon_draft_arena_studio/test/TerrainStudioCaptureRunner.tscn \
            -- --width=1280 --height=720 \
            --views=home,edit,validation,terrain_encounters_action,room_draft_encounters
      - name: Smoke runtime Rencontre
        run: |
          "$GODOT" --headless --path . \
            res://addons/dungeon_draft_arena_studio/encounter/test/EncounterStudioRuntimeSmoke.tscn
      - name: Smoke intégré Objets
        run: |
          "$GODOT" --headless --path . \
            res://addons/dungeon_draft_arena_studio/items/test/item_studio_smoke_runner.tscn
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: visual-smoke-artifacts
          path: artifacts/
          if-no-files-found: ignore
